# PARSeq config for model 0 — variable-length captchas trained on the
# 100K PHP-multi-library synthetic corpus (Securimage + Gregwar + KCAPTCHA
# + Cool PHP + Simple PHP).
#
# Mirrors model 1's parseq_v3.yaml but with max_label_length raised to 8
# (our corpus runs lengths 4-8) and data_dir pointing at our shard root.

data_dir: train_corpus
ckpt_dir: checkpoints/parseq
val_frac: 0.05
seed: 0
num_workers: 4

# image / label
img_size: [32, 128]   # [H, W] resize target
patch_size: [4, 8]    # [pH, pW]; 32/4=8 vert, 128/8=16 horiz patches
max_label_length: 8   # variable lengths 4-8 in our corpus

# architecture (same as model 1 v3 — 384d, 12 enc / 1 dec)
embed_dim: 384
enc_num_heads: 6
enc_mlp_ratio: 4
enc_depth: 12
dec_num_heads: 12
dec_mlp_ratio: 4
dec_depth: 1

# perms / decode
perm_num: 1
perm_forward: true
perm_mirrored: false
decode_ar: true
refine_iters: 1
dropout: 0.1

# optim / training
lr: 5.0e-4
warmup_pct: 0.05
weight_decay: 0.0
batch_size: 128
max_epochs: 15
gradient_clip_val: 5
precision: "32-true"

# Optional caps for smoke tests (0 = use all)
max_train: 0
max_val: 0
