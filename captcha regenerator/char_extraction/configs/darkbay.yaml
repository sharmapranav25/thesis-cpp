# DarkBay: 200x50, mixed alphanum, 6 chars (treat as variable in code).
# Dark teal bg, dark chars w/ light halo, vertical bars at L/R edges (~12px).
#
# v0: inherit otsu_cc default. The L/R structural bars are likely to
# survive thresholding and get rejected by the aspect-ratio filter
# (they're tall + narrow). If they do contaminate, IntensityBarCrop
# fallback strips them explicitly.

captcha_type: darkbay
expected_chars: [4, 8]

# Background is dark teal but characters are also dark — there's an
# inversion-like situation. Use auto polarity so detect_polarity picks
# whichever side has more pixels.
polarity: auto

morph_open_ksize: [2, 2]

# Image scale 200x50; chars roughly 20x30.
min_area: 60
max_area: 4000
min_height: 12
max_height: 46
min_width: 4
max_width: 60
min_aspect_ratio: 0.15
max_aspect_ratio: 2.0
