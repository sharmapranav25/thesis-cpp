[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "char_extraction"
version = "0.1.0"
description = "Phase 1: Extract character masks and per-character crops from CAPTCHA images. Open-source-only pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

dependencies = [
  "numpy>=1.26,<2",
  "opencv-contrib-python>=4.9,<5",
  "scikit-image>=0.22,<1",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pillow>=10,<12",
  "pyyaml>=6,<7",
  "pydantic>=2.5,<3",
  "matplotlib>=3.8,<4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
craft = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "craft-text-detector",
]
sam = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "timm>=1.0",
]
eval = [
  # Qwen2.5-VL-7B-Instruct as zero-shot eval pseudo-GT for char count + bbox.
  # Not part of the production extraction pipeline.
  "transformers>=4.49",
  "accelerate>=0.30",
  "qwen-vl-utils>=0.0.8",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.scripts]
char-extract               = "char_extraction.cli.extract_one:main"
char-extract-batch         = "char_extraction.cli.batch:main"
char-extract-eval          = "char_extraction.cli.eval:main"
char-extract-qwen-baseline = "char_extraction.cli.qwen_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
