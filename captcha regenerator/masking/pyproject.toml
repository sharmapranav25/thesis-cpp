[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masking"
version = "0.1.0"
description = "CAPTCHA character mask pipeline. Stage 0 colour gate -> Stage 2 HSV-or-DINO mask -> Stage 2.5 coverage validator. Open-source-only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

dependencies = [
  "numpy>=1.26,<2",
  "opencv-contrib-python>=4.9,<5",
  "scikit-image>=0.22,<1",
  "scipy>=1.11,<2",
  "pillow>=10,<12",
  "pyyaml>=6,<7",
  "pydantic>=2.5,<3",
  "tqdm>=4.66",
  "requests>=2.31",
]

[project.optional-dependencies]
dino = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "timm>=1.0",
]
qwen = [
  "torch>=2.2,<3",
  "transformers>=4.49",
  "accelerate>=0.30",
  "qwen-vl-utils>=0.0.8",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.scripts]
mask-extract = "masking.cli.extract_one:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
