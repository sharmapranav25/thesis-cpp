<!doctype html><html lang="en"><meta charset="utf-8"><title>Feature specialist jobs</title>
<style>body{font:16px system-ui;background:#101827;color:#e8eef8;max-width:1000px;margin:40px auto;padding:0 24px}h1{font-size:28px}.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}article{background:#1b293c;border:1px solid #34445c;border-radius:12px;padding:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}a{color:#8edbff}small{color:#b8c4d5}</style>
<h1>Independent feature specialists</h1><p>Separate data, models, feature-pop and view selection. No automatic production promotion.</p><div class="jobs" id="jobs"></div><p><small>Refreshes every 5 seconds. Shows each worker’s last reported state; a stale timestamp does not prove the process is still running.</small></p>
<script>
const specs=[['Curved interference','../feature_specialists_v2/runs/curves_v1/','training_01.stdout.log'],['Dot scatter','../feature_specialists_v2/dots/runs/dots_v1/','training_01.stdout.log']];
for(const [title,path,log] of specs){const card=document.createElement('article');const h=document.createElement('h2');h.textContent=title;card.append(h);const status=document.createElement('pre');card.append(status);const links=document.createElement('p');for(const [label,file] of [['Full status','status.json'],['Training log',log],['Results','RESULTS.md']]){const a=document.createElement('a');a.href=path+file;a.textContent=label;links.append(a,document.createTextNode(' · '));}card.append(links);document.getElementById('jobs').append(card);
async function refresh(){try{const response=await fetch(path+'status.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Status not available yet');const s=await response.json();const age=Math.max(0,Math.floor(Date.now()/1000-s.time));status.textContent=JSON.stringify({stage:s.stage,pid:s.pid,candidate:s.candidate,epoch:s.epoch,batch:s.batch,total_batches:s.total_batches,selection_ap:s.selection_ap,groups:s.groups,total:s.total,error:s.error,synthetic_gate_pass:s.synthetic_gate_pass,seconds_since_update:age},null,2);}catch(e){status.textContent=e.message;}}refresh();setInterval(refresh,5000);}
</script></html>
