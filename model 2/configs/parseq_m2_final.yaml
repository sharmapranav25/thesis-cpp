# Final attempt: gentlest possible curriculum on M1 v2.
# 3 epochs, no augmentation, tiny LR, light scheduled sampling, no gradual unfreeze.
# If this beats M1 v2's 39.78% on real CryptBB, M2 is meaningful.

data_dir: data/synth_fixed5_100k
ckpt_dir: checkpoints/parseq_m2_final
val_frac: 0.05
seed: 0
num_workers: 4

img_size: [32, 128]
patch_size: [4, 8]
max_label_length: 5

embed_dim: 384
enc_num_heads: 6
enc_mlp_ratio: 4
enc_depth: 12
dec_num_heads: 12
dec_mlp_ratio: 4
dec_depth: 1

perm_num: 1
perm_forward: true
perm_mirrored: false
decode_ar: true
refine_iters: 1
dropout: 0.1

lr: 1.0e-5                    # Very gentle (10x lower than M2-finetune)
warmup_pct: 0.05
weight_decay: 0.0
batch_size: 128
max_epochs: 3
gradient_clip_val: 5
precision: "32-true"

length_head_enabled: false
augment: false                # No aug (diagnostic showed aug = killer)

curriculum:
  kind: off

finetune_from: "E:/pranav/model 1/checkpoints/parseq_v2/parseq-epoch=11-val_accuracy=57.260.ckpt"

# Light scheduled sampling only.
sched_sample:
  enabled: true
  eps_max: 0.05
  warmup_epochs: 1            # Epoch 0 pure TF, epochs 1-2 light SS
