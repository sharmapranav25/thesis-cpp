# PARSeq config for Model 2: curriculum-driven training on a mixed-source
# captcha pool (50k fixed:5 + 50k range:3-7, all with d ~ U(0,1)).

data_dir: data/synth_curriculum
ckpt_dir: checkpoints/parseq_runA
val_frac: 0.05      # 5% synthetic-validation holdout
seed: 0
num_workers: 4

# image / label
img_size: [32, 128]   # [H, W] resize target (renderer width varies; resize normalizes)
patch_size: [4, 8]    # [pH, pW]; 32/4=8 vert, 128/8=16 horiz patches
max_label_length: 7   # accommodates length range 3-7

# architecture (matches Model 1)
embed_dim: 384
enc_num_heads: 6
enc_mlp_ratio: 4
enc_depth: 12
dec_num_heads: 12
dec_mlp_ratio: 4
dec_depth: 1

# perms / decode
perm_num: 1
perm_forward: true
perm_mirrored: false
decode_ar: true
refine_iters: 1
dropout: 0.1

# optim / training
lr: 5.0e-4
warmup_pct: 0.05
weight_decay: 0.0
batch_size: 128
max_epochs: 15
gradient_clip_val: 5
precision: "32-true"

# Model 2 additions
lengthmode_weight: 0.1     # auxiliary length-mode classifier loss weight

curriculum:
  enabled: true
  warmup_epochs: 8         # full d=1 reached at epoch 8 (of 15)
  schedule: linear
