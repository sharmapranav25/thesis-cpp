# Research-arc Model 1: random-synthetic baseline (no curriculum).
#
# Same data (synth_buckets), same total epochs (15), same no-aug, same from-
# scratch init as parseq_arc_m2.yaml. Difference: shuffled DataLoader, no
# bucket scheduling. M2 - M1 = the curriculum effect, isolated.

data_dir: data/synth_buckets
ckpt_dir: checkpoints/parseq_arc_m1
val_frac: 0.05
seed: 0
num_workers: 4

img_size: [32, 128]
patch_size: [4, 8]
max_label_length: 5

embed_dim: 384
enc_num_heads: 6
enc_mlp_ratio: 4
enc_depth: 12
dec_num_heads: 12
dec_mlp_ratio: 4
dec_depth: 1

perm_num: 1
perm_forward: true
perm_mirrored: false
decode_ar: true
refine_iters: 1
dropout: 0.1

lr: 5.0e-4
warmup_pct: 0.05
weight_decay: 0.0
batch_size: 128
max_epochs: 25
gradient_clip_val: 5
precision: "32-true"

length_head_enabled: false
augment: false

curriculum:
  kind: off
