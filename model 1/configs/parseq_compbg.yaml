# PARSeq trained on the composite-bg synth (PHP text + extracted real-bg
# samples with light augmentation). Mirrors parseq_v2.yaml exactly except for
# data_dir/ckpt_dir; same architecture so the 49.16%/86.86% v2 number is a
# direct head-to-head comparison.

data_dir: data/cryptbb_synth_compbg
ckpt_dir: checkpoints/parseq_compbg
val_frac: 0.05
seed: 0
num_workers: 4

img_size: [32, 128]
patch_size: [4, 8]
max_label_length: 5

embed_dim: 384
enc_num_heads: 6
enc_mlp_ratio: 4
enc_depth: 12
dec_num_heads: 12
dec_mlp_ratio: 4
dec_depth: 1

perm_num: 1
perm_forward: true
perm_mirrored: false
decode_ar: true
refine_iters: 1
dropout: 0.1

lr: 5.0e-4
warmup_pct: 0.05
weight_decay: 0.0
batch_size: 128
max_epochs: 15
gradient_clip_val: 5
precision: "32-true"
